apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mysql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "mysql.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "mysql.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "mysql.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mysql.serviceAccountName" . }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          ## ── Environment variables ──────────────────────────────
          env:
            ## Root password — always pulled from the Secret
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_ROOT_PASSWORD

            ## Default database
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}

            {{- if .Values.mysql.user }}
            ## Non-root user
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}
            ## Non-root user password — pulled from the Secret
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.existingSecret | quote }}
                  key: MYSQL_PASSWORD
            {{- end }}

            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          ## ── Volume mounts ──────────────────────────────────────
          volumeMounts:
            ## Data directory
            - name: data
              mountPath: /var/lib/mysql
            ## Custom my.cnf
            - name: config
              mountPath: /etc/mysql/conf.d/custom.cnf
              subPath: custom.cnf
              readOnly: true
            {{- if .Values.initScripts }}
            ## Init SQL/shell scripts — run once on first boot
            - name: initscripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}

          ## ── Probes ─────────────────────────────────────────────
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  mysqladmin ping -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  mysqladmin ping -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  mysql -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1"
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}

          ## ── Resources ──────────────────────────────────────────
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      ## ── Volumes ────────────────────────────────────────────────
      volumes:
        ## Data — reference the PVC created by pv-pvc.yaml
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mysql.pvcName" . }}

        ## my.cnf — rendered from ConfigMap
        - name: config
          configMap:
            name: {{ include "mysql.configMapName" . }}
            items:
              - key: custom.cnf
                path: custom.cnf

        {{- if .Values.initScripts }}
        ## Init scripts ConfigMap
        - name: initscripts
          configMap:
            name: {{ include "mysql.initScriptsConfigMapName" . }}
        {{- end }}