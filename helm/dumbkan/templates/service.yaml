apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-svc
  namespace: {{ .Values.appName }}-ns
spec:
  selector:
    app: {{ .Values.appName }}
  type: {{ .Values.service.type }}
  sessionAffinity: None
  ports:
    - name: {{ .Values.appName }}
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}