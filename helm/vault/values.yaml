# ============================================================
# values.yaml — Vault custom Helm chart
# Override any value with --set or a custom values file.
# ============================================================

## ── Image ────────────────────────────────────────────────────
image:
  repository: hashicorp/vault
  tag: "1.17"
  pullPolicy: IfNotPresent

## ── Replica ──────────────────────────────────────────────────
replicaCount: 1

## ── Name overrides ───────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

## ── Namespace ────────────────────────────────────────────────
namespace: vault-ns

## ── Vault configuration ──────────────────────────────────────
vault:
  ## Log level: trace, debug, info, warn, error
  logLevel: info
  ## Log format: standard, json
  logFormat: standard
  ## Address Vault advertises to the cluster
  apiAddr: "http://vault.vault-ns.svc.cluster.local:8200"
  ## Enable the built-in web UI
  ui: true

## ── Vault server config (vault.hcl) ──────────────────────────
## Rendered into a ConfigMap and mounted at /vault/config/
vaultConfig:
  storage:
    type: file
    path: /vault/data
  listener:
    type: tcp
    address: "0.0.0.0:8200"
    ## Set tls_disable to false and supply a cert/key to enable TLS
    tls_disable: true
    ## tls_cert_file: /vault/tls/tls.crt
    ## tls_key_file:  /vault/tls/tls.key

## ── Persistence (hostPath) ───────────────────────────────────
persistence:
  enabled: true
  ## Absolute path on the Kubernetes node
  hostPath: /mnt/ssd/kubernetes/vault
  ## DirectoryOrCreate → creates the path if it does not exist
  ## Directory         → path must already exist on the node
  hostPathType: DirectoryOrCreate
  ## Size is used for the PVC request (must match or be ≤ PV capacity)
  size: 10Gi
  ## Keep data when the PVC is deleted
  reclaimPolicy: Retain
  ## StorageClass — use "" for a manually-provisioned PV
  storageClassName: ""

## ── Service ──────────────────────────────────────────────────
service:
  type: NodePort
  ## Vault API / UI port
  port: 8200
  ## Vault cluster (HA) port — kept here for future HA expansion
  clusterPort: 8201
  clusterIP: ""
  ## Uncomment for NodePort access
  # type: NodePort
  nodePort: 30200

## ── Resource limits ──────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

## ── Probes ───────────────────────────────────────────────────
## NOTE: Vault returns 429 when sealed (not 200), so the liveness
## probe uses /v1/sys/health?standbyok=true&sealedok=true to avoid
## restarting a sealed-but-healthy pod.
livenessProbe:
  enabled: true
  path: /v1/sys/health?standbyok=true&sealedok=true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  ## Returns 200 only when initialised AND unsealed — keeps traffic away from a sealed pod.
  path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
  # path: /v1/sys/health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: true
  path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
  # path: /v1/sys/health?standbyok=true&sealedok=true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  ## Allow up to 5 min for first boot (30 × 10s)
  failureThreshold: 30
  

## ── Security context ─────────────────────────────────────────
## Vault's official image runs as root by default; the process
## drops privileges itself via IPC_LOCK.  Override if your image
## supports a non-root uid.
podSecurityContext:
  fsGroup: 1001

containerSecurityContext:
  runAsUser: 995
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  ## IPC_LOCK prevents memory from being swapped (mirrors cap_add: IPC_LOCK)
  capabilities:
    add:
      - IPC_LOCK

## ── Extra environment variables ──────────────────────────────
## Example:
##   - name: VAULT_LOG_LEVEL
##     value: debug
extraEnvVars: []

## ── Pod annotations / labels ─────────────────────────────────
podAnnotations: {}
podLabels: {}

## ── Node scheduling ──────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

## ── Service account ──────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
