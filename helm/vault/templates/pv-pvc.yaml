{{- if .Values.persistence.enabled }}
# ── PersistentVolume ──────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "vault.pvName" . }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: {{ .Values.persistence.reclaimPolicy }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  hostPath:
    path: {{ .Values.persistence.hostPath }}
    type: {{ .Values.persistence.hostPathType }}
  # Bind this PV exclusively to the PVC in vault-ns
  claimRef:
    name: {{ include "vault.pvcName" . }}
    namespace: {{ .Values.namespace }}
---
# ── PersistentVolumeClaim ─────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vault.pvcName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  # Explicitly bind to the PV created above
  volumeName: {{ include "vault.pvName" . }}
{{- end }}
