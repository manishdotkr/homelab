apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: go2kart
  namespace: argocd-ns
spec:
  description: go2kart homelab project — custom chart
  sourceRepos:
    - https://github.com/manishdotkr/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: go2kart-ns
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go2kart
  namespace: argocd-ns
spec:
  project: go2kart
  source:
    repoURL: https://github.com/manishdotkr/homelab.git
    targetRevision: main
    path: helm/go2kart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: go2kart-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true